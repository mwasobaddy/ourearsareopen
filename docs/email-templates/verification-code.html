<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Your verification code</title>
</head>
<body style="margin:0;padding:0;background:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f8;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
          <tr>
            <td style="background:linear-gradient(135deg,#a15a2a,#d1a07a);padding:32px 32px 24px;text-align:center;">
              <h1 style="margin:0;color:#ffffff;font-size:28px;font-weight:700;">Verification code</h1>
              <p style="margin:8px 0 0;color:#f5efe3;font-size:15px;">Use this code to verify your identity</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;text-align:center;">
              <h2 style="margin:0 0 12px;color:#111827;font-size:22px;">Your verification code</h2>
              <p style="margin:0 0 24px;color:#4b5563;line-height:1.6;font-size:15px;">
                Use the code below to verify your identity. It expires shortly.
              </p>
              <div style="display:inline-block;background:#f9fafb;border:2px dashed #d1a07a;border-radius:12px;padding:24px 40px;">
                <span style="font-size:32px;font-weight:700;letter-spacing:6px;color:#a15a2a;">{{ .Token }}</span>
              </div>
              <p style="margin:24px 0 0;color:#6b7280;font-size:13px;">
                If you didn’t request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background:#f9fafb;padding:20px 32px;text-align:center;">
              <p style="margin:0;color:#9ca3af;font-size:12px;">© 2026 Our Ears Are Open. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
